[package]
name = "uu-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional UU account, rendezvous and compatible session plugin"

[features]
default = ["enabled"]
enabled = []

[dependencies]
uu-core = { path = "../../crates/uu-core" }
uu-proto = { path = "../../crates/uu-proto" }
uu-media = { path = "../../crates/uu-media" }
uu-i18n = { path = "../../crates/uu-i18n" }
async-trait = "0.1"
anyhow.workspace = true
bytes.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true
hex.workspace = true
uuid.workspace = true
zeroize = "1"
rand.workspace = true
fs2 = "0.4"
gethostname = "1.1"
flate2 = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.11"
socket2 = "0.5"
uu-capture = {path="../../crates/uu-capture"}
