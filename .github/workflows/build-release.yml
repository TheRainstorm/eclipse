name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0
  # Builds and tests must succeed without service credentials.
  UU_SIGNING_KEY_FILE: /nonexistent/uu-client-ci-signing-key

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, windows-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 tools/security/scan_secrets.py --history
          python3 -m unittest discover -s tools/security -p 'test_*.py' -v
          python3 -m unittest discover -s tools/windows -p 'test_*.py' -v
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/release/check_version.py "$RELEASE_TAG"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libssl-dev
      - name: Install Linux development libraries
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get install --no-install-recommends -y libasound2-dev libpulse-dev pulseaudio pulseaudio-utils libva-dev libgbm-dev libdrm-dev libclang-dev libxkbcommon-dev libxkbcommon-x11-dev sway grim xvfb libegl1 libgl1-mesa-dri
      - name: Install Windows cross toolchain
        if: matrix.platform == 'windows-x64'
        run: |
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          if [ '${{ matrix.platform }}' = windows-x64 ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Test and package Linux
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo test --workspace --release --features vaapi --locked
          python3 tools/linux/package.py
          python3 tools/native/smoke.py --exe target/release/uu --decoder sw --audio
          for archive in artifacts/packages/*.tar.gz; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - name: Test authorized X11 input and owned window lifecycle
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-input --example input_probe --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/input_probe --output artifacts/input-x11
          cargo build --release -p uu-core --example native_control_probe --features vaapi --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/native_control_probe --output artifacts/native-input-authorized
          python3 tools/native/input_smoke.py --probe target/release/examples/native_control_probe --probe-arg=--read-only --output artifacts/native-input-readonly
          cargo build --release -p uu-gui --example x11_destroyed_window_probe --features vaapi --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/x11_destroyed_window_probe --report-field window --output artifacts/x11-destroyed-window
      - name: Test native text clipboard on two owned desktops
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-gui --example native_clipboard_probe --features vaapi --locked
          python3 tools/native/clipboard_smoke.py --probe target/release/examples/native_clipboard_probe --output artifacts/native-clipboard
      - name: Test system-output audio against an owned null sink
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-media --example audio_capture_probe --locked
          python3 tools/native/audio_smoke.py --probe target/release/examples/audio_capture_probe --output artifacts/native-audio
      - name: Test isolated Wayland viewer and mixed DPI
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-gui --example wayland_input --features vaapi --locked
          python3 tools/native/wayland_smoke.py --gui target/release/uu-gui --cli target/release/uu --input-driver target/release/examples/wayland_input --output artifacts/native-wayland --renderer pixman --decoder sw --multi-dpi
      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        run: |
          python3 tools/windows/package.py
          for archive in artifacts/packages/*.zip; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - name: Build Windows input and isolated clipboard validation
        if: matrix.platform == 'windows-x64'
        run: |
          cargo build -p uu-input --release --target x86_64-pc-windows-gnu --example windows_owned_probe --locked
          cargo build -p uu-gui --release --target x86_64-pc-windows-gnu --example windows_clipboard_probe --locked
          cargo build -p uu-media --release --target x86_64-pc-windows-gnu --example color_probe --locked
          cargo test -p uu-input --release --target x86_64-pc-windows-gnu --lib --no-run --locked --message-format=json-render-diagnostics > artifacts/input-test-build.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          messages = [json.loads(line) for line in Path('artifacts/input-test-build.jsonl').read_text().splitlines()]
          executables = [m['executable'] for m in messages if m.get('reason') == 'compiler-artifact' and m.get('profile', {}).get('test') and m.get('executable')]
          if len(executables) != 1:
              raise RuntimeError('Expected exactly one freshly built input validation executable')
          destination = Path('artifacts/validation/input-tests.exe')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(executables[0], destination)
          shutil.copy2('target/x86_64-pc-windows-gnu/release/examples/windows_clipboard_probe.exe', destination.parent / 'clipboard-probe.exe')
          shutil.copy2('target/x86_64-pc-windows-gnu/release/examples/color_probe.exe', destination.parent / 'color-probe.exe')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'windows-x64'
        with:
          name: validation-windows-fixtures
          path: artifacts/validation/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uu-client-${{ matrix.platform }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-smoke:
    name: Windows executable smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uu-client-windows-x64
          path: downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-windows-fixtures
          path: platform-validation
      - name: Verify payload and load executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem downloads -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $unpack = Join-Path $env:RUNNER_TEMP 'uu-client-smoke'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unpack
          $manifest = Get-Content -Raw (Join-Path $unpack 'version.json') | ConvertFrom-Json
          foreach ($item in $manifest.sha256.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $unpack $item.Name) -Algorithm SHA256).Hash -ne $item.Value) {
              throw 'Payload checksum mismatch'
            }
          }
          & (Join-Path $unpack 'uu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable could not start' }
          python tools/native/smoke.py --exe (Join-Path $unpack 'uu.exe') --decoder sw --audio
          if ($LASTEXITCODE -ne 0) { throw 'Windows native encrypted video smoke failed' }
          $inputTests = Join-Path $unpack 'input-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/input-tests.exe' -Destination $inputTests
          & $inputTests --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows input mapping/lifecycle tests failed' }
          $clipboardProbe = Join-Path $unpack 'clipboard-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/clipboard-probe.exe' -Destination $clipboardProbe
          & $clipboardProbe --isolated-window-station
          if ($LASTEXITCODE -ne 0) { throw 'Windows isolated clipboard lifecycle failed' }
          $colorProbe = Join-Path $unpack 'color-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/color-probe.exe' -Destination $colorProbe
          & $colorProbe
          if ($LASTEXITCODE -ne 0) { throw 'Windows H264 color metadata validation failed' }
          Remove-Item -LiteralPath $inputTests, $clipboardProbe, $colorProbe

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uu-client-*
          merge-multiple: true
          path: release-assets
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$PWD/docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes" ]; then
            echo 'Add curated release notes before publishing a milestone.' >&2
            exit 1
          fi
          cd release-assets
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "uu-client $RELEASE_TAG" --notes-file "$notes" -- ./*.zip ./*.tar.gz SHA256SUMS
