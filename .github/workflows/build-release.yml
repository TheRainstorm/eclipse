name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0
  # Builds and tests must succeed without service credentials.
  UU_SIGNING_KEY_FILE: /nonexistent/uu-client-ci-signing-key

jobs:
  linux-media:
    name: Linux media quick validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libva-dev libgbm-dev libdrm-dev libclang-dev libasound2-dev libpulse-dev
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-x86_64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-linux-x86_64-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            cargo-linux-x86_64-${{ env.RUST_TOOLCHAIN }}-
      - name: Validate and build only the media probe
        run: |
          python3 tools/security/scan_secrets.py
          cargo test -p uu-input --lib --release --locked
          cc -Wall -Wextra -Werror crates/uu-input/src/gamepad/uhid.c tools/native/uhid_contract_smoke.c -o target/uhid-contract-smoke
          target/uhid-contract-smoke
          # Check VPL without VA-API, then the software-only feature set.
          cargo check -p uu-media --locked
          cargo check -p uu-media --no-default-features --features h264 --locked
          cargo test -p uu-media --lib --release --features vaapi --locked
          cargo build -p uu-media --example vaapi_readback_probe --release --features vaapi --locked
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          out = pathlib.Path('artifacts/media-fast')
          out.mkdir(parents=True)
          probe = out / 'vaapi_readback_probe'
          shutil.copy2('target/release/examples/vaapi_readback_probe', probe)
          (out / 'provenance.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'], 'features': ['vaapi'],
              'sha256': {probe.name: hashlib.sha256(probe.read_bytes()).hexdigest()},
              'scope': 'media-only; full platform validation is still required',
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-media-validation-fast
          path: artifacts/media-fast/*
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer validation
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate installer with PowerShell 7
        shell: pwsh
        run: '& ./tools/windows/test_installer.ps1 | Out-Host'
      - name: Validate installer with Windows PowerShell
        shell: powershell
        run: '& ./tools/windows/test_installer.ps1 | Out-Host'

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    # A cold Linux run also installs the compositor/audio stack and links each
    # release binary; the previous 45-minute budget expired during packaging.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, windows-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 tools/security/scan_secrets.py --history
          python3 -m unittest discover -s tools/security -p 'test_*.py' -v
          python3 -m unittest discover -s tools/windows -p 'test_*.py' -v
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/release/check_version.py "$RELEASE_TAG"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libssl-dev
      - name: Install Linux development libraries
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get install --no-install-recommends -y libasound2-dev libpulse-dev pulseaudio pulseaudio-utils libva-dev libgbm-dev libdrm-dev libclang-dev libxkbcommon-dev libxkbcommon-x11-dev libpipewire-0.3-dev pipewire pipewire-bin libpipewire-0.3-modules python3-dbus python3-gi sway grim xvfb libegl1 libgl1-mesa-dri
      - name: Install Windows cross toolchain
        if: matrix.platform == 'windows-x64'
        run: |
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          if [ '${{ matrix.platform }}' = windows-x64 ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Test and package Linux
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo test --workspace --lib --bins --tests --release --features vaapi --locked
          cargo test --workspace --doc --release --features vaapi --locked
          cargo build --release -p uu-media --example vaapi_readback_probe --features vaapi --locked
          cargo build --release -p uu-gui --example video_dma_probe --features vaapi --locked
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          out = pathlib.Path('artifacts/gpu-validation')
          out.mkdir(parents=True)
          probe = out / 'video_dma_probe'
          shutil.copy2('target/release/examples/video_dma_probe', probe)
          (out / 'provenance.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'sha256': {probe.name: hashlib.sha256(probe.read_bytes()).hexdigest()},
              'scope': 'built in CI; actual DMA-BUF rendering requires a GPU validation host',
          }, indent=2) + '\n')
          PY
          cargo test --manifest-path vendor/webrtc-srtp/Cargo.toml --release --target-dir target
          python3 tools/linux/package.py
          python3 tools/native/smoke.py --exe target/release/uu --decoder sw --audio
          python3 tools/native/lan_smoke.py --exe target/release/uu --output artifacts/native-lan-cli
          for archive in artifacts/packages/*.tar.gz; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux-x86_64'
        with:
          name: linux-media-validation
          path: target/release/examples/vaapi_readback_probe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'linux-x86_64'
        with:
          name: linux-gpu-validation
          path: artifacts/gpu-validation/*
          if-no-files-found: error
          retention-days: 14
      - name: Test authorized X11 input and owned window lifecycle
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-input --example input_probe --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/input_probe --output artifacts/input-x11
          cargo build --release -p uu-core --example native_control_probe --features vaapi --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/native_control_probe --output artifacts/native-input-authorized
          python3 tools/native/input_smoke.py --probe target/release/examples/native_control_probe --probe-arg=--read-only --output artifacts/native-input-readonly
          cargo build --release -p uu-gui --example x11_destroyed_window_probe --features vaapi --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/x11_destroyed_window_probe --report-field window --output artifacts/x11-destroyed-window
      - name: Test planar video rendering on an owned GL framebuffer
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-gui --example video_renderer_probe --features vaapi --locked
          python3 tools/native/input_smoke.py --probe target/release/examples/video_renderer_probe --report-field video --output artifacts/video-renderer
          python3 tools/native/input_smoke.py --probe target/release/examples/video_renderer_probe --report-field video --probe-arg=--benchmark --output artifacts/video-upload-planar
          python3 tools/native/input_smoke.py --probe target/release/examples/video_renderer_probe --report-field video --probe-arg=--benchmark --probe-arg=--rgba-reference --output artifacts/video-upload-rgba
      - name: Test native text clipboard on two owned desktops
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-gui --example native_clipboard_probe --features vaapi --locked
          python3 tools/native/clipboard_smoke.py --probe target/release/examples/native_clipboard_probe --output artifacts/native-clipboard
      - name: Test system-output audio against an owned null sink
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-media --example audio_capture_probe --locked
          python3 tools/native/audio_smoke.py --probe target/release/examples/audio_capture_probe --output artifacts/native-audio
      - name: Test isolated Wayland viewer and mixed DPI
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-gui --example wayland_input --features vaapi --locked
          python3 tools/native/wayland_smoke.py --gui target/release/uu-gui --cli target/release/uu --input-driver target/release/examples/wayland_input --output artifacts/native-wayland --renderer pixman --decoder sw --multi-dpi
      - name: Test isolated Intel VPL ABI contracts
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-media --example vpl_contract_probe --features vaapi --locked
          python3 tools/native/vpl_contract_smoke.py --probe target/release/examples/vpl_contract_probe --cli target/release/uu
      - name: Test portal capture, consent cancellation and owned input
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo build --release -p uu-capture --example portal_probe --locked
          for scenario in deny cancel cancel-select cancel-select-call cancel-init stream-view stream-input stream-no-input stream-keyboard-only stream-input-denied; do
            python3 tools/native/portal_smoke.py --probe target/release/examples/portal_probe --case "$scenario"
          done
          python3 tools/native/portal_smoke.py --probe target/release/examples/portal_probe --cli target/release/uu --case stream-native
          cargo build --release -p uu-core --example native_display_probe --locked
          python3 tools/native/portal_smoke.py --probe target/release/examples/native_display_probe --case stream-displays
      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        run: |
          python3 tools/windows/package.py
          for archive in artifacts/packages/*.zip; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - name: Build Windows input and isolated clipboard validation
        if: matrix.platform == 'windows-x64'
        run: |
          cargo build -p uu-input --release --target x86_64-pc-windows-gnu --example windows_owned_probe --locked
          cargo build -p uu-gui --release --target x86_64-pc-windows-gnu --example windows_clipboard_probe --locked
          cargo build -p uu-media --release --target x86_64-pc-windows-gnu --example color_probe --locked
          cargo build -p uu-gui --release --target x86_64-pc-windows-gnu --example video_renderer_probe --locked
          cargo test -p uu-input --release --target x86_64-pc-windows-gnu --lib --no-run --locked --message-format=json-render-diagnostics > artifacts/input-test-build.jsonl
          cargo test -p uu-gui --release --target x86_64-pc-windows-gnu --bin uu-gui --no-run --locked --message-format=json-render-diagnostics > artifacts/gui-test-build.jsonl
          cargo test -p uu-core --release --target x86_64-pc-windows-gnu --lib --no-run --locked --message-format=json-render-diagnostics > artifacts/core-test-build.jsonl
          cargo test -p uu-media --release --target x86_64-pc-windows-gnu --lib --no-run --locked --message-format=json-render-diagnostics > artifacts/media-test-build.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          messages = [json.loads(line) for line in Path('artifacts/input-test-build.jsonl').read_text().splitlines()]
          executables = [m['executable'] for m in messages if m.get('reason') == 'compiler-artifact' and m.get('profile', {}).get('test') and m.get('executable')]
          if len(executables) != 1:
              raise RuntimeError('Expected exactly one freshly built input validation executable')
          destination = Path('artifacts/validation/input-tests.exe')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(executables[0], destination)
          shutil.copy2('target/x86_64-pc-windows-gnu/release/examples/windows_clipboard_probe.exe', destination.parent / 'clipboard-probe.exe')
          shutil.copy2('target/x86_64-pc-windows-gnu/release/examples/color_probe.exe', destination.parent / 'color-probe.exe')
          shutil.copy2('target/x86_64-pc-windows-gnu/release/examples/video_renderer_probe.exe', destination.parent / 'video-renderer-probe.exe')
          gui_messages = [json.loads(line) for line in Path('artifacts/gui-test-build.jsonl').read_text().splitlines()]
          gui_tests = [m['executable'] for m in gui_messages if m.get('reason') == 'compiler-artifact' and m.get('profile', {}).get('test') and m.get('executable')]
          if len(gui_tests) != 1:
              raise RuntimeError('Expected exactly one freshly built GUI keyboard validation executable')
          shutil.copy2(gui_tests[0], destination.parent / 'keyboard-tests.exe')
          core_messages = [json.loads(line) for line in Path('artifacts/core-test-build.jsonl').read_text().splitlines()]
          core_tests = [m['executable'] for m in core_messages if m.get('reason') == 'compiler-artifact' and m.get('profile', {}).get('test') and m.get('executable')]
          if len(core_tests) != 1:
              raise RuntimeError('Expected exactly one Windows core validation executable')
          shutil.copy2(core_tests[0], destination.parent / 'core-tests.exe')
          media_messages = [json.loads(line) for line in Path('artifacts/media-test-build.jsonl').read_text().splitlines()]
          media_tests = [m['executable'] for m in media_messages if m.get('reason') == 'compiler-artifact' and m.get('profile', {}).get('test') and m.get('executable')]
          if len(media_tests) != 1:
              raise RuntimeError('Expected exactly one Windows media validation executable')
          shutil.copy2(media_tests[0], destination.parent / 'media-tests.exe')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'windows-x64'
        with:
          name: validation-windows-fixtures
          path: artifacts/validation/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uu-client-${{ matrix.platform }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-smoke:
    name: Windows executable smoke test
    needs: [build, windows-installer]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uu-client-windows-x64
          path: downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-windows-fixtures
          path: platform-validation
      - name: Verify payload and load executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem downloads -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $unpack = Join-Path $env:RUNNER_TEMP 'uu-client-smoke'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unpack
          $manifest = Get-Content -Raw (Join-Path $unpack 'version.json') | ConvertFrom-Json
          foreach ($item in $manifest.sha256.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $unpack $item.Name) -Algorithm SHA256).Hash -ne $item.Value) {
              throw 'Payload checksum mismatch'
            }
          }
          & (Join-Path $unpack 'uu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable could not start' }
          python tools/native/smoke.py --exe (Join-Path $unpack 'uu.exe') --decoder sw --audio
          if ($LASTEXITCODE -ne 0) { throw 'Windows native encrypted video smoke failed' }
          $inputTests = Join-Path $unpack 'input-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/input-tests.exe' -Destination $inputTests
          & $inputTests --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows input mapping/lifecycle tests failed' }
          $keyboardTests = Join-Path $unpack 'keyboard-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/keyboard-tests.exe' -Destination $keyboardTests
          # This binary uses the Windows GUI subsystem. Piping forces
          # PowerShell to wait and set LASTEXITCODE for this invocation.
          & $keyboardTests 'keyboard_capture::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows keyboard ownership/AltGr tests failed' }
          & $keyboardTests 'input_capture::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows input capture UI state tests failed' }
          & $keyboardTests 'stream_menu::tests::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows fullscreen menu action tests failed' }
          & $keyboardTests 'single_instance::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher single instance tests failed' }
          & $keyboardTests 'isolated_keyboard_hook_pumps_messages_while_ui_is_blocked' --ignored --test-threads=1 --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Windows keyboard hook lifecycle failed' }
          & $keyboardTests 'lan_host_ui::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows LAN sharing lifecycle tests failed' }
          & $keyboardTests 'lan_ui::tests::native_lan_page_refused' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows manual LAN connection timeout/error reporting failed' }
          & $keyboardTests 'lan_ui::tests::native_lan_page_worker_exit' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows LAN worker failure reporting failed' }
          & $keyboardTests 'settings::tests::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows preferences migration/persistence failed' }
          & $keyboardTests 'theme::tests::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI contrast checks failed' }
          & $keyboardTests 'window::tests::settings_use_application_minimum' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows settings/stream window sizing transition failed' }
          $coreTests = Join-Path $unpack 'core-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/core-tests.exe' -Destination $coreTests
          & $coreTests 'native_lan::tests::native_lan_port_conflicts' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows TCP/UDP conflict and custom discovery tests failed' }
          $mediaTests = Join-Path $unpack 'media-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/media-tests.exe' -Destination $mediaTests
          & $mediaTests 'encoder::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows encoder thread/fallback/colour/IDR validation failed' }
          & $keyboardTests 'native_interfaces::' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows native address filtering failed' }
          & $keyboardTests 'refreshing_interfaces_preserves_explicit_address' --nocapture | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows native interface discovery changed sharing state' }
          $clipboardProbe = Join-Path $unpack 'clipboard-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/clipboard-probe.exe' -Destination $clipboardProbe
          & $clipboardProbe --isolated-window-station
          if ($LASTEXITCODE -ne 0) { throw 'Windows isolated clipboard lifecycle failed' }
          $colorProbe = Join-Path $unpack 'color-validation.exe'
          Copy-Item -LiteralPath 'platform-validation/color-probe.exe' -Destination $colorProbe
          & $colorProbe
          if ($LASTEXITCODE -ne 0) { throw 'Windows H264 color metadata validation failed' }
          Remove-Item -LiteralPath $inputTests, $keyboardTests, $coreTests, $clipboardProbe, $colorProbe

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke, linux-media]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uu-client-*
          merge-multiple: true
          path: release-assets
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$PWD/docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes" ]; then
            echo 'Add curated release notes before publishing a milestone.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/existing-release-state" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/existing-release-state")" != false ]; then
              echo 'An existing draft requires its own publication workflow.' >&2
              exit 1
            fi
            python3 tools/release/download.py --repo "$GH_REPO" --tag "$RELEASE_TAG" \
              --platform all --output-dir "$RUNNER_TEMP/verified-published-release"
            echo 'Published packages match this tag and their checksums; retaining immutable release assets.'
            exit 0
          fi
          cd release-assets
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          release_flags=()
          case "$RELEASE_TAG" in
            *-*) release_flags+=(--prerelease --latest=false) ;;
          esac
          gh release create "$RELEASE_TAG" --verify-tag --title "uu-client $RELEASE_TAG" --notes-file "$notes" "${release_flags[@]}" -- ./*.zip ./*.tar.gz SHA256SUMS
