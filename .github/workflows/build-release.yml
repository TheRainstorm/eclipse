name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0
  # Builds and tests must succeed without service credentials.
  UU_SIGNING_KEY_FILE: /nonexistent/uu-client-ci-signing-key

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, windows-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 tools/security/scan_secrets.py --history
          python3 -m unittest discover -s tools/security -p 'test_*.py' -v
          python3 -m unittest discover -s tools/windows -p 'test_*.py' -v
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
          if [ "$REF_TYPE" = tag ]; then
            python3 tools/release/check_version.py "$RELEASE_TAG"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config cmake nasm libssl-dev
      - name: Install Linux development libraries
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get install --no-install-recommends -y libasound2-dev libva-dev libgbm-dev libdrm-dev libclang-dev libxkbcommon-dev
      - name: Install Windows cross toolchain
        if: matrix.platform == 'windows-x64'
        run: |
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-win32
      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          if [ '${{ matrix.platform }}' = windows-x64 ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Test and package Linux
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo test --workspace --release --features vaapi --locked
          python3 tools/linux/package.py
          python3 tools/native/smoke.py --exe target/release/uu
          for archive in artifacts/packages/*.tar.gz; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        run: |
          python3 tools/windows/package.py
          for archive in artifacts/packages/*.zip; do
            python3 tools/security/scan_secrets.py --artifact "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uu-client-${{ matrix.platform }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-smoke:
    name: Windows executable smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uu-client-windows-x64
          path: downloads
      - name: Verify payload and load executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem downloads -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $unpack = Join-Path $env:RUNNER_TEMP 'uu-client-smoke'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unpack
          $manifest = Get-Content -Raw (Join-Path $unpack 'version.json') | ConvertFrom-Json
          foreach ($item in $manifest.sha256.PSObject.Properties) {
            if ((Get-FileHash -LiteralPath (Join-Path $unpack $item.Name) -Algorithm SHA256).Hash -ne $item.Value) {
              throw 'Payload checksum mismatch'
            }
          }
          & (Join-Path $unpack 'uu.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable could not start' }
          python tools/native/smoke.py --exe (Join-Path $unpack 'uu.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows native encrypted video smoke failed' }

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: uu-client-*
          merge-multiple: true
          path: release-assets
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$PWD/docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes" ]; then
            echo 'Add curated release notes before publishing a milestone.' >&2
            exit 1
          fi
          cd release-assets
          sha256sum -- *.zip *.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "uu-client $RELEASE_TAG" --notes-file "$notes" -- ./*.zip ./*.tar.gz SHA256SUMS
