[package]
name = "uu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "uu-client — open-source remote desktop streaming client"

[[bin]]
name = "eclipse"
path = "src/main.rs"

[dependencies]
uu-plugin-sdk = {path="../uu-plugin-sdk"}
uu-i18n = { path = "../uu-i18n" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = {version="1",features=["serde"]}
sha2.workspace = true
raw-window-handle = "0.6"
winit = {version="0.30.13",default-features=false,features=["x11","wayland"]}
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico", "bmp"] }
tokio.workspace = true
uuid.workspace = true
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
uu-core = { path = "../uu-core" }
uu-clipboard = { path = "../uu-clipboard" }
uu-proto = { path = "../uu-proto" }
uu-input = { path = "../uu-input" }
sdl2 = { version = "0.38", features = ["bundled", "static-link", "hidapi"] }
if-addrs = "0.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Services"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
egui-winit = { version = "0.29.1", default-features = false, features = ["preserve-key-events"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control", "image-data"] }

[dev-dependencies]
uu-media = { path = "../uu-media" }

[features]
default = []
vaapi = ["uu-core/vaapi","uu-plugin-sdk/vaapi"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon-dl = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
