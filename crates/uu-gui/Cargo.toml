[package]
name = "uu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UU Remote desktop client (Rust)"

[[bin]]
name = "uu-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
qrcode = "0.14"
raw-window-handle = "0.6"
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio.workspace = true
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
uu-core = { path = "../uu-core" }
uu-proto = { path = "../uu-proto" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory"] }

[features]
vaapi = ["uu-core/vaapi"]
