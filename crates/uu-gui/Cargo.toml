[package]
name = "uu-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "uu-client — open-source remote desktop streaming client"

[[bin]]
name = "uu-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
qrcode = "0.14"
raw-window-handle = "0.6"
reqwest.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tokio.workspace = true
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
uu-core = { path = "../uu-core" }
uu-proto = { path = "../uu-proto" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
egui-winit = { version = "0.29.1", default-features = false, features = ["preserve-key-events"] }
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

[features]
vaapi = ["uu-core/vaapi"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon-dl = "0.4"
libc = "0.2"
