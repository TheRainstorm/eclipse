[package]
name = "uu-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen capture backends (Windows: WGC/DXGI, Linux: PipeWire/X11)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uu-media = { path = "../uu-media" }
uu-input = { path = "../uu-input" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }


[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = "0.9"
tokio.workspace = true
futures-util = "0.3"
