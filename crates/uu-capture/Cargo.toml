[package]
name = "uu-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen capture backends (Windows: WGC/DXGI, Linux: PipeWire/X11)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uu-media = { path = "../uu-media" }
uu-input = { path = "../uu-input" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Threading"] }


[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
pipewire = "0.9"
tokio.workspace = true
futures-util = "0.3"
libc = "0.2"
memmap2 = "0.9"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
