[package]
name = "uu-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authorized desktop input backends (Windows: SendInput, Linux: XTest)"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
keycode = "1.0.0"
serde.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
vigem-rust = { version = "0.2", default-features = false, features = ["ds4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
