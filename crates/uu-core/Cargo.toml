[package]
name = "uu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session orchestration, signaling client and device model"

[dependencies]
async-trait = "0.1"
anyhow.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true
hex.workspace = true
uuid.workspace = true
zeroize = "1"
socket2 = "0.5"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
webrtc = "0.11"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
uu-proto = { path = "../uu-proto" }
uu-media = { path = "../uu-media" }
uu-capture = { path = "../uu-capture" }
uu-input = { path = "../uu-input" }

[dev-dependencies]
tokio = { workspace = true }

[features]
vaapi = ["uu-media/vaapi"]
