[package]
name = "uu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session orchestration, signaling client and device model"

[dependencies]
uu-i18n = { path = "../uu-i18n" }
async-trait = "0.1"
url = "2"
anyhow.workspace = true
bytes.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
zeroize = "1"
rand = "0.8"
ring = "0.17"
spake2 = "0.4"
fs2 = "0.4"
gethostname = "1.1"
rcgen = "0.13"
subtle = "2.6"
socket2 = "0.5"
if-addrs = "0.15.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = "1"
webrtc = "0.11"
tokio-rustls = {version="0.26",default-features=false,features=["ring","logging","tls12"]}
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
uu-proto = { path = "../uu-proto" }
uu-media = { path = "../uu-media" }
uu-capture = { path = "../uu-capture" }
uu-input = { path = "../uu-input" }

[dev-dependencies]
tokio = { workspace = true }
crc32fast.workspace = true

[features]
vaapi = ["uu-media/vaapi"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_IO", "Win32_System_Performance", "Win32_Media", "Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Services", "Win32_System_Registry", "Win32_System_LibraryLoader"] }
