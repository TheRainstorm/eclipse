[package]
name = "uu-cli"
autobins = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Eclipse command-line tools (Windows/Linux)"

[[bin]]
name = "eclipse-cli"
path = "src/main.rs"

[[bin]]
name = "eclipse-signal"
path = "src/bin/uu-signal.rs"

[dependencies]
uu-plugin-sdk = {path="../uu-plugin-sdk"}
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uu-core = { path = "../uu-core" }
uu-clipboard = { path = "../uu-clipboard" }
uuid.workspace = true
hex.workspace = true
serde.workspace = true
sha2.workspace = true
uu-proto = { path = "../uu-proto" }
uu-capture = { path = "../uu-capture" }
uu-input = { path = "../uu-input" }
uu-media = { path = "../uu-media" }

[features]
default = []
vaapi = ["uu-core/vaapi","uu-plugin-sdk/vaapi"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Environment", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
