[package]
name = "animal-island-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Reusable cozy island controls for egui, with no application dependencies"
repository = "https://github.com/TheRainstorm/eclipse"

[dependencies]
egui = { version = "0.29", default-features = false }

[dev-dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
