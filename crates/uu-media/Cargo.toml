[package]
name = "uu-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Video/audio pipeline abstractions (encode, decode, frame transport)"

[[example]]
name = "d3d11_surface_probe"
required-features = ["h264", "d3d11va"]

[[example]]
name = "color_probe"
required-features = ["h264"]

[[example]]
name = "encoder_probe"
required-features = ["h264"]

[[example]]
name = "vaapi_readback_probe"
required-features = ["h264", "vaapi"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
uu-proto = { path = "../uu-proto" }
opus = "0.3.1"
audiopus_sys = { version = "0.2.2", features = ["static"] }
rubato = { version = "0.16.2", default-features = false }
cros-codecs = { version = "0.0.6", default-features = false }

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["h264", "d3d11va"]
h264 = ["dep:openh264"]
# Windows: Media Foundation H.264 decode on a D3D11 device manager (D3D11VA).
# Only has an effect on Windows targets.
d3d11va = ["dep:windows"]
# Linux: VA-API stateless decode via cros-codecs. Needs libva and libgbm
# development packages at build time, so it is opt-in.
vaapi = ["cros-codecs/vaapi", "dep:cros-libva", "dep:libc"]

[dependencies.openh264]
version = "0.9"
optional = true

[target.'cfg(windows)'.dependencies]
cpal = "0.15.3"
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.15.3"
libpulse-binding = "2.30.1"
cros-libva = { version = "0.0.12", optional = true }
libc = { version = "0.2", optional = true }
